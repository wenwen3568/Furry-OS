name: Build Furry OS ISO
on:
  push:
    branches: [ "main" ]
  release:
    types: [ "published" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-utils mtools dosfstools

      - name: Build ISO
        run: |
          export DEBIAN_FRONTEND=noninteractive
          chmod +x config/hooks/chroot/*.bin config/hooks/live/*.bin 2>/dev/null || true

          sudo lb clean --purge
          sudo dpkg-divert --remove /usr/sbin/start-stop-daemon 2>/dev/null || true
          sudo rm -rf chroot/ cache/ build/ config/chroot
          sudo rm -f auto/config

          sudo env \
            LB_BOOTSTRAP=ubuntu \
            LB_DISTRIBUTION=jammy \
            LB_ARCHITECTURES=amd64 \
            LB_MIRROR_BOOTSTRAP=http://archive.ubuntu.com/ubuntu/ \
            LB_MIRROR_CHROOT=http://archive.ubuntu.com/ubuntu/ \
            LB_INSTALLER=calamares \
            LB_TASKS=ubuntu-desktop-minimal \
            LB_IMAGE_NAME=furry-os \
            LB_ISO_APPLICATION="Furry OS" \
            LB_PACKAGE_LISTS="base desktop" \
            LB_HOOK_DIR=config/hooks \
            LB_INCLUDES=config/includes.chroot \
            LB_ISO_HYBRID=true \
            LB_UEFI_IMAGE=true \
            LB_ISO_FILENAME=furry-os-amd64.iso \
            lb config

          # 构建 ISO，忽略清理阶段的错误
          sudo lb build || true

          # 查找 ISO 文件：优先在 binary/ 目录下查找
          echo "=== Searching for ISO in binary/ ==="
          if [ -d "binary" ]; then
            ls -lh binary/*.iso || echo "No ISO in binary/"
            ISO_FILE=$(find binary/ -maxdepth 1 -name "*.iso" -type f -print -quit)
          else
            echo "binary directory not found, searching in current dir"
            ISO_FILE=$(find . -maxdepth 1 -name "*.iso" -type f -print -quit)
          fi

          if [ -n "$ISO_FILE" ]; then
            echo "Found ISO: $ISO_FILE"
            cp "$ISO_FILE" ./furry-os-amd64.iso
            ls -lh ./furry-os-amd64.iso
          else
            echo "No ISO file found in binary/ or current directory!"
            # 如果没找到，尝试在整个项目目录搜索（但跳过权限问题）
            echo "Trying full search (ignoring permission errors)..."
            ISO_FILE=$(find . -name "*.iso" -type f -not -path "./chroot/*" -print -quit 2>/dev/null)
            if [ -n "$ISO_FILE" ]; then
              echo "Found ISO via full search: $ISO_FILE"
              cp "$ISO_FILE" ./furry-os-amd64.iso
              ls -lh ./furry-os-amd64.iso
            else
              echo "Still no ISO found. Build may have failed."
              exit 1
            fi
          fi
      
      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: furry-os-amd64.iso
          path: ./*.iso

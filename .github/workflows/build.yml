       name: Build Furry OS ISO
on:
  push:
    branches: [ "main" ]
  release:
    types: [ "published" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-utils mtools dosfstools

      - name: Build ISO
        run: |
          export DEBIAN_FRONTEND=noninteractive
          chmod +x config/hooks/chroot/*.bin config/hooks/live/*.bin 2>/dev/null || true
          chmod +x auto/config

          # 清理
          sudo lb clean --purge
          sudo rm -rf chroot/ cache/ binary/ config/chroot

          # 配置（auto/config 会自动读取）
          sudo lb config

          # 分步构建（跳过清理阶段）
          echo "=== Bootstrap ==="
          sudo lb bootstrap || true

          echo "=== Chroot ==="
          sudo lb chroot || true

          echo "=== Binary (generates ISO) ==="
          sudo lb binary || true

          # 提取 ISO
          echo "=== Extracting ISO ==="
          if [ -d "binary" ]; then
            cp binary/*.iso ./furry-os-amd64.iso 2>/dev/null && echo "ISO copied from binary/!" || echo "No ISO in binary/"
          fi

          if [ ! -f ./furry-os-amd64.iso ]; then
            echo "Searching whole workspace..."
            find . -name "*.iso" -type f -not -path "./chroot/*" -print -exec cp {} ./furry-os-amd64.iso \; 2>/dev/null
          fi

          if [ -f ./furry-os-amd64.iso ]; then
            ls -lh ./furry-os-amd64.iso
          else
            echo "ERROR: No ISO found!"
            exit 1
          fi

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: furry-os-amd64.iso
          path: ./furry-os-amd64.iso
      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: furry-os-amd64.iso
          path: ./furry-os-amd64.iso

name: Build Furry OS ISO
on:
  push:
    branches: [ "main" ]
  release:
    types: [ "published" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-utils mtools dosfstools genisoimage

      - name: Build ISO
        run: |
          export DEBIAN_FRONTEND=noninteractive
          chmod +x config/hooks/chroot/*.bin config/hooks/live/*.bin 2>/dev/null || true
          sudo lb clean --purge
          sudo lb clean --binary
          sudo dpkg-divert --remove /usr/sbin/start-stop-daemon 2>/dev/null || true
          sudo rm -rf chroot/ cache/ build/ config/chroot
          sudo rm -f auto/config
          sudo env \
            LB_BOOTSTRAP=ubuntu \
            LB_DISTRIBUTION=jammy \
            LB_ARCHITECTURES=amd64 \
            LB_MIRROR_BOOTSTRAP=http://archive.ubuntu.com/ubuntu/ \
            LB_MIRROR_CHROOT=http://archive.ubuntu.com/ubuntu/ \
            LB_INSTALLER=calamares \
            LB_TASKS=ubuntu-desktop-minimal \
            LB_IMAGE_NAME=furry-os \
            LB_ISO_APPLICATION="Furry OS" \
            LB_PACKAGE_LISTS="base desktop" \
            LB_HOOK_DIR=config/hooks \
            LB_INCLUDES=config/includes.chroot \
            LB_ISO_HYBRID=true \
            LB_UEFI_IMAGE=true \
            LB_ISO_FILENAME=furry-os-amd64.iso \
            lb config
          sudo lb build --verbose
          ls -lh *.iso || echo "No ISO found!"

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: furry-os-amd64.iso
          path: ./*.iso

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./*.iso
          asset_name: furry-os-amd64.iso
          asset_content_type: application/octet-stream

name: Build Furry OS ISO
on:
  push:
    branches: [ "main" ]
  release:
    types: [ "published" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-utils mtools dosfstools
      - name: Clean and Build
        run: |
          sudo chmod +x auto/config
          sudo lb clean --purge
          sudo lb config
          sudo lb build
      - uses: actions/upload-artifact@v4
        with:
          name: furry-os-amd64.iso
          path: ./live-image-amd64.hybrid.iso

name: Build Furry OS ISO
on:
  push:
    branches: [ "main" ]
  release:
    types: [ "published" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-utils mtools dosfstools
      - name: Build ISO
        run: |
          sudo lb clean --purge
          sudo rm -rf chroot/
          sudo rm -f auto/config   # 移除 auto/config，避免干扰
          sudo env \
            LB_BOOTSTRAP=ubuntu \
            LB_DISTRIBUTION=jammy \
            LB_ARCHITECTURES=amd64 \
            LB_MIRROR_BOOTSTRAP=https://mirrors.ustc.edu.cn/ubuntu/ \
            LB_MIRROR_CHROOT=https://mirrors.ustc.edu.cn/ubuntu/ \
            LB_INSTALLER=calamares \
            LB_TASKS=ubuntu-desktop-minimal \
            LB_IMAGE_NAME=furry-os \
            LB_ISO_APPLICATION="Furry OS" \
            LB_PACKAGE_LISTS="base desktop" \
            LB_HOOK_DIR=config/hooks \
            LB_INCLUDES=config/includes.chroot \
            LB_ISO_HYBRID=true \
            LB_UEFI_IMAGE=true \
            LB_ISO_FILENAME=furry-os-amd64.iso \
            lb config
          sudo lb build
      - uses: actions/upload-artifact@v4
        with:
          name: furry-os-amd64.iso
          path: ./live-image-amd64.hybrid.iso
